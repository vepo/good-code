name: Good Code CI

on:
  push:
  pull_request:
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} — {1}', github.event.pull_request.number, github.head_ref || github.ref_name)
      || github.event_name == 'workflow_dispatch'
      && 'Manual quality gate'
      || format('{0} — {1}', github.event_name, github.ref_name) }}

concurrency:
  group: good-code-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Resolve project version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GoodCode version: $VERSION"

      - name: Maven verify
        run: mvn -B verify jacoco:report

      - name: SonarCloud analysis
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=vepo_good-code
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-code-test-reports-${{ env.PROJECT_VERSION }}-${{ github.run_number }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: good-code-jacoco-${{ env.PROJECT_VERSION }}-${{ github.run_number }}
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 14

  package-deployables:
    name: Package Deployables
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Resolve project version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Kafka bridge runner
        run: mvn -B -pl bridge/good-code-kafka-bridge-runner -am package -DskipTests

      - name: Stage deployable artifacts
        run: |
          mkdir -p staging/deployables
          RUNNER_JAR="bridge/good-code-kafka-bridge-runner/target/good-code-kafka-bridge-runner-${PROJECT_VERSION}.jar"
          cp "$RUNNER_JAR" "staging/deployables/good-code-kafka-bridge-runner-${PROJECT_VERSION}.jar"
          sha256sum "staging/deployables/"* > "staging/deployables/SHA256SUMS.txt"

      - name: Upload deployable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: good-code-deployables-${{ env.PROJECT_VERSION }}-${{ github.run_number }}
          path: staging/deployables/
          retention-days: 30